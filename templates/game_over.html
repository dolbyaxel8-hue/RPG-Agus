<!DOCTYPE html>
<html>

<head>

<title>Derrota</title>

<style>

body{
    background: radial-gradient(circle, #330000, #050505);
    color:white;
    font-family:Arial;
    text-align:center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.caja{

    width:500px;
    padding:40px;
    border:3px solid darkred;
    border-radius:20px;
    background:#111;
    box-shadow:0 0 30px red;

}


h1{

    font-size:70px;
    color:#ff2222;
    text-shadow:0 0 20px red;

}


h2{

    color:#aaa;

}


.stats{

    margin-top:30px;
    font-size:22px;
    line-height:1.8;

}


button{

    margin-top:30px;
    padding:15px 40px;
    font-size:22px;
    cursor:pointer;
    background:#8b0000;
    color:white;
    border:2px solid red;
    border-radius:10px;

}


button:hover{

    background:red;

}


</style>

</head>


<body>


<div class="caja">


<h1>☠️ GAME OVER ☠️</h1>


<h2>
La mazmorra te ha derrotado...
pero puedes volver a intentarlo mi niña
</h2>


<div class="stats">

🏰 Piso alcanzado:
<br>
<b>{{ jugador.piso }}</b>

<br><br>

⭐ Nivel:
<br>
<b>{{ jugador.nivel }}</b>

<br><br>

✨ Experiencia:
<br>
<b>{{ jugador.experiencia }}</b>

<br><br>

⚔️ Daño:
<br>
<b>{{ jugador.daño }}</b>

<br><br>

💰 Oro conseguido:
<br>
<b>{{ jugador.oro }}</b>


</div>


<form action="/" method="get">

<button>
🔄 Intentar otra aventura
</button>

</form>


</div>


</body>

</html>
